<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Arpimc</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#e5e5e5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Space Grotesk',sans-serif}
.card{background:#171717;border:1px solid #2a2a2a;border-radius:24px;padding:32px;width:100%;max-width:480px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#00ff8820;color:#00ff88;border:1px solid #00ff8830;padding:8px 14px;border-radius:99px;font-size:14px;font-family:'JetBrains Mono',monospace;margin-bottom:20px}
.dot{width:9px;height:9px;background:#00ff88;border-radius:50%;box-shadow:0 0 12px #00ff88}
h1{font-size:32px;line-height:1.1;margin-bottom:10px}
p.sub{color:#888;font-size:15px;margin-bottom:24px;line-height:1.4}
.field{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:14px;padding:18px;margin-bottom:16px;position:relative;cursor:pointer;transition:0.2s}
.field:active{scale:0.98;border-color:#00ff88}
.field label{font-family:'JetBrains Mono',monospace;font-size:12px;color:#666;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px}
.field code{font-family:'JetBrains Mono',monospace;font-size:17px;color:#fff;word-break:break-all}
.copy{position:absolute;right:14px;top:14px;background:#262626;color:#aaa;font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 10px;border-radius:8px}
.how{background:#1e1e1e;border-radius:14px;padding:18px;margin-top:4px}
.how ol{padding-left:18px;color:#aaa;font-size:15px;line-height:1.7}
.how b{color:#fff}
.btn{display:block;text-align:center;margin-top:20px;background:#00ff88;color:#000;font-weight:700;padding:16px;border-radius:14px;text-decoration:none;font-size:16px}
.footer{margin-top:22px;text-align:center;color:#666;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
<div class="badge"><div class="dot"></div> SYSTEM ONLINE</div>
<h1>DNS Arpimc Aktif.</h1>
<p class="sub">Bypass ISP & blokir iklan. Deploy di Vercel Medan.</p>

<div class="field" onclick="copyDNS()">
<label>Hostname DNS Private - klik untuk salin</label>
<span class="copy" id="copyText">SALIN</span>
<code id="dnsHost">dns-arpimc.vercel.app</code>
</div>

<div class="how">
<ol>
<li>Buka <b>Pengaturan</b></li>
<li>Pilih <b>Jaringan & Internet</b></li>
<li>Pilih <b>DNS Pribadi</b></li>
<li>Isi <b>dns-arpimc.vercel.app</b></li>
</ol>
</div>

<a class="btn" href="/dns-query?dns=AAABAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB">Test DNS → Download = Sukses</a>
<div class="footer">arpimc dns 2026</div>
</div>

<script>
function copyDNS(){
  const text = document.getElementById('dnsHost').innerText;
  navigator.clipboard.writeText(text);
  const el = document.getElementById('copyText');
  el.innerText = 'TERSALIN!';
  el.style.color = '#00ff88';
  setTimeout(()=>{ el.innerText='SALIN'; el.style.color='#aaa'; },1500);
}
</script>
</body>
</html>
