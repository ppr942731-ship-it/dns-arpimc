<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#e5e5e5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Space Grotesk',sans-serif}
.card{background:#171717;border:1px solid #2a2a2a;border-radius:20px;padding:28px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.badge{display:inline-flex;align-items:center;gap:8px;background:#00ff8820;color:#00ff88;border:1px solid #00ff8830;padding:6px 12px;border-radius:99px;font-size:13px;font-family:'JetBrains Mono',monospace;margin-bottom:18px}

h1{font-size:28px;line-height:1.1;margin-bottom:8px}
p.sub{color:#888;font-size:14px;margin-bottom:20px}
.field{background:#0f0f0f;border:1px solid #262626;border-radius:12px;padding:14px;margin-bottom:14px}
.field label{font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px}
.field code{font-family:'JetBrains Mono',monospace;font-size:15px;color:#fff;word-break:break-all}
.how{background:#1c1c1c;border-radius:12px;padding:16px;margin-top:4px}
.how ol{padding-left:18px;color:#aaa;font-size:14px;line-height:1.6}
.how b{color:#fff}
.btn{display:block;text-align:center;margin-top:18px;background:#00ff88;color:#000;font-weight:700;padding:14px;border-radius:12px;text-decoration:none;font-size:15px}
.footer{margin-top:20px;text-align:center;color:#555;font-family:'JetBrains Mono',monospace;font-size:11px}
</style>
</head>
<body>
<div class="card">
